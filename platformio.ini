; PlatformIO 專案設定檔
; 預設目標板：AI-Thinker ESP32-CAM (OV2640)
;
; 若你的板子是 ESP32-S3 系列（例如 XIAO ESP32S3 Sense / ESP32-S3-CAM），
; 請改用最下方註解掉的 [env:esp32s3cam] 區段，並在 main.cpp 切換 CAMERA_MODEL。

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

; 序列埠監控速率（程式內 Serial.begin 也用這個）
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-CAM 需要 PSRAM 才能跑較高解析度
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

; 燒錄速率（AI-Thinker 透過 USB-TTL，460800 通常穩定，不穩可降到 115200）
upload_speed = 460800


; ───────────────────────────────────────────────
; ESP32-S3 系列板子請改用這個環境（把上面那段註解掉、解開這段）
; ───────────────────────────────────────────────
; [env:esp32s3cam]
; platform = espressif32
; board = esp32s3box
; framework = arduino
; monitor_speed = 115200
; monitor_filters = esp32_exception_decoder
; build_flags =
;     -DBOARD_HAS_PSRAM
;     -DARDUINO_USB_CDC_ON_BOOT=1
;     -DCORE_DEBUG_LEVEL=1
